name: Flutter Ready check
description: >
  Runs `flutter_ready check` against an app's pubspec.lock and fails the
  job when any plugin blocks this season's platform deadlines (SPEC §3.4).
inputs:
  lockfile:
    description: Path to the app's pubspec.lock, relative to the workspace.
    required: false
    default: pubspec.lock
  data:
    description: >
      Path or URL to the readiness data (latest.json). Leave unset to use
      flutter_ready's own default (the live main-branch data on GitHub).
    required: false
    default: ''
outputs:
  report:
    description: The full text of the `flutter_ready check` report.
    value: ${{ steps.run-check.outputs.report }}
runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Install flutter_ready
      shell: bash
      run: dart pub global activate --source path "${{ github.action_path }}/packages/flutter_ready"

    - name: Run flutter_ready check
      id: run-check
      shell: bash
      run: |
        args=(check --lockfile "${{ inputs.lockfile }}")
        if [ -n "${{ inputs.data }}" ]; then
          args+=(--data "${{ inputs.data }}")
        fi
        set +e
        report="$(dart pub global run flutter_ready "${args[@]}")"
        exit_code=$?
        set -e
        echo "$report"
        {
          echo "report<<FLUTTER_READY_REPORT_EOF"
          echo "$report"
          echo "FLUTTER_READY_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"
        exit $exit_code
