name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Analyze and test every package
        run: |
          set -o pipefail
          mkdir -p test_output
          failed=0
          for pubspec in packages/*/pubspec.yaml; do
            pkg_dir="$(dirname "$pubspec")"
            pkg_name="$(basename "$pkg_dir")"
            echo "::group::$pkg_name"

            dart pub get -C "$pkg_dir"

            if ! dart analyze --fatal-infos "$pkg_dir"; then
              failed=1
            fi

            if ! (cd "$pkg_dir" && dart test --reporter expanded) \
                2>&1 | tee "test_output/$pkg_name.txt"; then
              failed=1
            fi

            echo "::endgroup::"
          done
          exit $failed

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output/
