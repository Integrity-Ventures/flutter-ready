name: Verify Action

on:
  push:
  pull_request:

jobs:
  fails-on-known-blocker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run flutter_ready check on the fixture with a known blocker
        id: check
        continue-on-error: true
        uses: ./
        with:
          lockfile: fixtures/sample_app/pubspec.lock
          data: fixtures/sample_app/data/latest.json

      - name: Assert the action failed on the known blocker
        run: |
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "Expected the action to fail on fixtures/sample_app/pubspec.lock's known fixture_blocked_plugin blocker, but it reported '${{ steps.check.outcome }}'."
            exit 1
          fi

          report="${{ steps.check.outputs.report }}"
          if [[ "$report" != *"BLOCKER: fixture_blocked_plugin"* ]]; then
            echo "Expected the report to contain a BLOCKER line for fixture_blocked_plugin, but got:"
            echo "$report"
            exit 1
          fi

          echo "Confirmed: the action failed with a BLOCKER line for fixture_blocked_plugin, as expected."

  passes-on-no-blocker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run flutter_ready check on the fixture with no blocker
        id: check
        uses: ./
        with:
          lockfile: fixtures/sample_app/pubspec_green.lock
          data: fixtures/sample_app/data/latest.json

      - name: Assert the action succeeded
        run: |
          report="${{ steps.check.outputs.report }}"
          if [[ "$report" == *"BLOCKER"* ]]; then
            echo "Expected no BLOCKER line for fixture_green_plugin, but got:"
            echo "$report"
            exit 1
          fi

          echo "Confirmed: the action succeeded with no BLOCKER line, as expected."
