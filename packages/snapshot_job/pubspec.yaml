name: snapshot_job
description: >
  Nightly job that assembles one dated readiness snapshot for the Flutter
  Ready board, using the shared readiness_check library.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.5.0
  http: ^1.2.0
  path: ^1.9.0
  readiness_check:
    path: ../readiness_check

dev_dependencies:
  archive: ^4.3.0
  lints: ^4.0.0
  test: ^1.25.0
