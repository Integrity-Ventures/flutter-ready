name: flutter_ready
description: >
  Reads an app's pubspec.lock and reports which of its plugins will block
  this season's App Store or Play release, using the Flutter Ready data.
version: 0.1.0
publish_to: none
homepage: https://ready.hireflutter.dev
repository: https://github.com/Integrity-Ventures/flutter-ready

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.5.0
  http: ^1.2.0
  path: ^1.9.0
  readiness_check:
    path: ../readiness_check
  yaml: ^3.1.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

executables:
  flutter_ready:
